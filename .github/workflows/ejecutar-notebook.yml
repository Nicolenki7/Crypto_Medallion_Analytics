name: ejecutar notebook con salidas

on:
  push:
    paths:
      - '.github/workflows/ejecutar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install --quiet nbconvert ipykernel pandas matplotlib
      - name: Cabecera para el reclutador
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell

          RUTA = 'notebooks/crypto_medallion_colab.ipynb'
          TEXTO = '''[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Nicolenki7/Crypto_Medallion_Analytics/blob/main/notebooks/crypto_medallion_colab.ipynb)

> **En 30 segundos:** 13 meses y 100 monedas: el precio medio cae 24,9 % y el retorno lo cargan unas pocas monedas, no el mercado entero.
>
> - 13 meses de serie y 100 monedas comparadas
> - Precio medio: 5.360 a 4.025 USD (−24,9 %)
> - Un archivo de origen vacío detectado y documentado como fallo de pipeline, sin rellenarlo con ceros
>
> Los resultados ya están ejecutados: no hace falta correr nada para leerlos.'''

          nb = nbformat.read(RUTA, as_version=4)
          primero = ''.join(nb.cells[0].source) if nb.cells else ''
          if 'En 30 segundos' not in primero:
              nb.cells.insert(0, new_markdown_cell(TEXTO))
              nbformat.write(nb, RUTA)
              print('cabecera insertada')
          else:
              print('cabecera ya presente')
          PY
      - name: Ejecutar
        run: jupyter nbconvert --to notebook --execute --inplace "notebooks/crypto_medallion_colab.ipynb" --ExecutePreprocessor.timeout=900
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "notebooks/crypto_medallion_colab.ipynb"
          git commit -m "chore: notebook ejecutado con salidas guardadas" || echo "sin cambios"
          git push
